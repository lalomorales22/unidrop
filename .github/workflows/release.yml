name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  linux-appimage:
    name: Build Linux AppImage (${{ matrix.go_arch }})
    if: github.repository_owner == 'lalomorales22'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go_arch: amd64
          - runner: ubuntu-24.04-arm
            go_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate tag and build reviewed AppImage
        env:
          GO_CMD: go
          TARGET_ARCH: ${{ matrix.go_arch }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          tools="$RUNNER_TEMP/unidrop-appimage-tools"
          ./scripts/fetch-appimage-tools.sh "$TARGET_ARCH" "$tools"
          appimagetool=$(find "$tools" -maxdepth 1 -type f -name 'appimagetool-*.AppImage' -print -quit)
          runtime=$(find "$tools" -maxdepth 1 -type f -name 'runtime-*' -print -quit)
          APPIMAGETOOL="$appimagetool" APPIMAGE_RUNTIME="$runtime" ./scripts/build-linux-appimage.sh "$TARGET_ARCH"
      - name: Preserve reviewed AppImage for the trusted release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unidrop-appimage-${{ matrix.go_arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Build, sign, attest, and publish
    if: github.repository_owner == 'lalomorales22'
    needs: linux-appimage
    runs-on: macos-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore reviewed Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unidrop-appimage-*
          path: dist
          merge-multiple: true
      - name: Validate release tag and key configuration
        id: release-version
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.UNIDROP_RELEASE_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test -n "$RELEASE_SIGNING_KEY_B64"
          test -f release/release-public.pem
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Materialize protected signing key
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.UNIDROP_RELEASE_SIGNING_KEY_B64 }}
        run: |
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/unidrop-release-private.pem";fs.writeFileSync(p,Buffer.from(process.env.RELEASE_SIGNING_KEY_B64,"base64"),{mode:0o600})'
      - name: Build all artifacts and metadata
        run: ./scripts/build-all.sh
      - name: Sign release manifest
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          go run ./cmd/unidrop-release sign \
            --private "$RUNNER_TEMP/unidrop-release-private.pem" \
            --manifest "dist/unidrop-$version-manifest.json" \
            --signature "dist/unidrop-$version-manifest.sig.json"
          node scripts/release-metadata.mjs --checksums-only
          go run ./cmd/unidrop-release verify \
            --public release/release-public.pem \
            --manifest "dist/unidrop-$version-manifest.json" \
            --signature "dist/unidrop-$version-manifest.sig.json"
          node scripts/verify-release.mjs
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/unidrop-${{ steps.release-version.outputs.value }}.spdx.json
      - name: Publish immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "UniDrop $GITHUB_REF_NAME"
