name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  release:
    name: Build, sign, attest, and publish
    if: github.repository_owner == 'lalomorales22'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_SIGNING_KEY_B64: ${{ secrets.UNIDROP_RELEASE_SIGNING_KEY_B64 }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate release tag and key configuration
        id: release-version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test -n "$RELEASE_SIGNING_KEY_B64"
          test -f release/release-public.pem
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Materialize protected signing key
        run: |
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/unidrop-release-private.pem";fs.writeFileSync(p,Buffer.from(process.env.RELEASE_SIGNING_KEY_B64,"base64"),{mode:0o600})'
      - name: Build all artifacts and metadata
        run: ./scripts/build-all.sh
      - name: Sign release manifest
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          go run ./cmd/unidrop-release sign \
            --private "$RUNNER_TEMP/unidrop-release-private.pem" \
            --manifest "dist/unidrop-$version-manifest.json" \
            --signature "dist/unidrop-$version-manifest.sig.json"
          node scripts/release-metadata.mjs --checksums-only
          go run ./cmd/unidrop-release verify \
            --public release/release-public.pem \
            --manifest "dist/unidrop-$version-manifest.json" \
            --signature "dist/unidrop-$version-manifest.sig.json"
          node scripts/verify-release.mjs
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/unidrop-${{ steps.release-version.outputs.value }}.spdx.json
      - name: Publish immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "UniDrop $GITHUB_REF_NAME"
