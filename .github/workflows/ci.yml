name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Unit and integration tests
        run: go test -mod=vendor ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race -mod=vendor ./...
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Formatting
        shell: bash
        run: |
          files=$(find main.go main_test.go cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Parse Unix installers
        if: runner.os != 'Windows'
        run: sh -n install.sh uninstall.sh scripts/*.sh
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('install.ps1', 'uninstall.ps1', 'scripts/smoke-install.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Install, upgrade, stop/start, uninstall, and reinstall smoke test
        if: runner.os != 'Windows'
        env:
          GO_CMD: go
        run: sh scripts/smoke-install.sh
      - name: Windows install, upgrade, stop/start, uninstall, and reinstall smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-install.ps1

  website:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate development Flatpak manifest
        run: |
          node --test scripts/verify-flatpak.test.mjs
          node scripts/verify-flatpak.mjs
      - name: Build and test dependency-free site
        working-directory: site
        run: npm test

  release-build:
    name: Cross-platform release build
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build every desktop target and release metadata
        env:
          UNIDROP_BUILD_DEVELOPMENT_DMG: "1"
        run: ./scripts/build-all.sh
      - name: Verify artifact hashes and metadata
        shell: bash
        run: |
          version=$(tr -d '\r\n' < internal/version/VERSION)
          test -f "dist/unidrop-$version-macos-universal.dmg"
          node scripts/verify-release.mjs

  linux-appimage:
    name: Linux AppImage (${{ matrix.go_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            go_arch: amd64
          - runner: ubuntu-24.04-arm
            go_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Fetch reviewed AppImage tools and build twice reproducibly
        env:
          GO_CMD: go
          TARGET_ARCH: ${{ matrix.go_arch }}
        shell: bash
        run: |
          tools="$RUNNER_TEMP/unidrop-appimage-tools"
          ./scripts/fetch-appimage-tools.sh "$TARGET_ARCH" "$tools"
          appimagetool=$(find "$tools" -maxdepth 1 -type f -name 'appimagetool-*.AppImage' -print -quit)
          runtime=$(find "$tools" -maxdepth 1 -type f -name 'runtime-*' -print -quit)
          APPIMAGETOOL="$appimagetool" APPIMAGE_RUNTIME="$runtime" ./scripts/build-linux-appimage.sh "$TARGET_ARCH"
          version=$(tr -d '\r\n' < internal/version/VERSION)
          artifact="dist/unidrop-$version-linux-$TARGET_ARCH.AppImage"
          first_hash=$(sha256sum "$artifact" | awk '{print $1}')
          APPIMAGETOOL="$appimagetool" APPIMAGE_RUNTIME="$runtime" ./scripts/build-linux-appimage.sh "$TARGET_ARCH"
          second_hash=$(sha256sum "$artifact" | awk '{print $1}')
          test "$first_hash" = "$second_hash"

  required:
    name: Required CI
    if: always()
    needs: [go, website, release-build, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.NEEDS_JSON); if(Object.values(n).some(x=>x.result!=="success")){console.error(n);process.exit(1)}'
